<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millikan's Basement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1113; --panel:#15191d; --panel2:#1b2025; --line:#2a3138; --text:#e7e3d9; --muted:#8d969f;
  --amber:#f2a541; --plus:#ff6161; --minus:#4fa6ff; --beam:#7dffb3; --ghost:#ffb347; --shot2:#ff7ad9;
  --ok:#6bdc8c; --bad:#ff7a6b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.4;font-weight:500}
sub{font-size:.72em;vertical-align:-.28em;line-height:0}
button,input,select{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px 16px;border-bottom:1px solid var(--line);background:#0a0c0e}
.brand .kicker{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.brand h1{margin:2px 0 0;font-size:27px;font-weight:700;letter-spacing:-.01em}
nav.modes{display:flex;gap:6px;flex-wrap:wrap;flex:1}
nav.modes button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;color:var(--muted);min-height:40px}
nav.modes button.on{border-color:var(--amber);color:var(--text);background:#2a2216}
.predict-switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch{position:relative;width:52px;height:30px;border-radius:15px;background:#2a3138;border:1px solid var(--line);cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch.on{background:#3a2c14;border-color:var(--amber)}
.switch.on::after{left:25px;background:var(--amber)}
main{display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:calc(100vh - 110px)}
@media (max-width:920px){main{grid-template-columns:1fr}}
.stage{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}
.canvas-wrap{position:relative;flex:1;min-height:440px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#modInput{position:absolute;display:none;z-index:5;background:#040605;border:1.5px solid var(--amber);border-radius:5px;color:#ffb648;font:700 18px 'JetBrains Mono',monospace;text-align:right;padding:0 8px;outline:none;box-shadow:0 0 0 3px rgba(242,165,65,.25)}
.setup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.setup .sep{width:1px;height:30px;background:var(--line);margin:0 4px}
.fld{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-weight:600}
.fld select,.fld input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;min-height:40px;color:var(--text);font-weight:600}
.fld input{width:70px;font-family:'JetBrains Mono',monospace}
.tog{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);border-radius:20px;padding:8px 14px;min-height:40px;cursor:pointer;color:var(--muted);font-weight:600}
.tog i{width:10px;height:10px;border-radius:50%;background:#3a434c;flex:none}
.tog.on{color:var(--text);border-color:#6a5530;background:#221c12}
.tog.on i{background:var(--amber);box-shadow:0 0 8px rgba(242,165,65,.7)}
.tog:disabled{opacity:.4;cursor:not-allowed}
.key{display:grid;gap:4px;font-size:13px;margin-bottom:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#111417}
.key i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.key b{font-size:15px;margin-right:2px}
.sec{color:var(--amber);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.rhr{display:flex;align-items:center;gap:12px;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#111417;font-size:13px;color:var(--muted)}
.rhr b{color:var(--text)}
.overlay-tl{position:absolute;top:10px;left:12px;font:600 13px 'JetBrains Mono',monospace;color:var(--amber);pointer-events:none;text-shadow:0 0 4px #000}
.view-btns{position:absolute;top:8px;right:10px;display:flex;gap:6px}
.view-btns button{width:40px;height:40px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
.firebar{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 16px;cursor:pointer;min-height:48px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.fire{background:#3b1d14;border-color:#ff7a4a;color:#ffd9c9;min-width:120px;font-size:17px;letter-spacing:.05em}
.btn.primary{background:#2a2216;border-color:var(--amber)}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
aside{background:var(--panel);overflow-y:auto;max-height:calc(100vh - 110px)}
@media (max-width:920px){aside{max-height:none}}
section.card{border-bottom:1px solid var(--line);padding:12px 16px}
section.card h2{margin:0 0 8px;font:700 13.5px 'Space Grotesk',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctl{margin:8px 0 12px}
.ctl .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.ctl label{font-size:14px}
.ctl input[type=number]{width:96px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;text-align:right;font-family:'JetBrains Mono',monospace}
.ctl .unit{font:13px 'JetBrains Mono',monospace;color:var(--muted);min-width:34px}
input[type=range]{width:100%;accent-color:var(--amber);height:28px}
select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;min-height:40px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;cursor:pointer;color:var(--muted);min-height:40px;font-size:14px}
.seg button.on{background:#2a2216;color:var(--text)}
.toggle-row{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.disabled-block{opacity:.38;pointer-events:none}
.locked .ctl input,.locked .ctl select,.locked .seg,.locked .switch{pointer-events:none;opacity:.6}
.ro{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14.5px}
.ro div:has(> .sec){padding-top:8px}
.ro .k{color:var(--muted)}
.ro .v{font-family:'JetBrains Mono',monospace;font-weight:600;text-align:right}
.ro .note{grid-column:1/-1;color:var(--muted);font-size:12.5px;font-family:inherit;text-align:left}
.hidden-note{color:var(--muted);font-size:13px;font-style:italic}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.prompt{background:#1f1a12;border:1px solid #4a3a1c;border-radius:8px;padding:10px 12px;font-size:14.5px}
.prompt b{color:var(--amber)}
.givens{font-family:'JetBrains Mono',monospace;font-size:13px;margin-top:6px;color:#e9d9b8}
.answer{display:flex;gap:8px;margin-top:10px}
.answer input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:16px}
.choices{display:grid;gap:8px;margin-top:10px}
.choices button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:44px}
.choices button.on{border-color:var(--amber);background:#2a2216}
.feedback{margin-top:10px;border-radius:8px;padding:10px 12px;font-size:14px}
.feedback.ok{background:#14261a;border:1px solid #2f6b40}
.feedback.bad{background:#2a1614;border:1px solid #7a3229}
.feedback .big{font-weight:700;font-size:16px;margin-bottom:4px}
.solbox{margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:8px}
.solbox summary{cursor:pointer;color:#f6c983;font-weight:600}
.solhead{color:#f6c983;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
ol.sol{margin:6px 0 0;padding-left:28px;display:grid;gap:7px}
ol.sol .why{color:#b8b2a6;font-size:13px}
ol.sol .eq{font-size:14.5px;font-weight:600;color:var(--text);padding-left:2px;overflow-wrap:anywhere}
ol.sol li:last-child .eq{color:#ffd27a}
.mono{font-family:'JetBrains Mono',monospace}
.small{font-size:12.5px;color:var(--muted)}
.log{max-height:180px;overflow-y:auto;font-size:12.5px}
.log table{width:100%;border-collapse:collapse}
.log td,.log th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}
.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(14,17,19,.92)}
.placeholder .box{max-width:520px;border:1px solid var(--line);border-radius:10px;padding:20px 22px;background:var(--panel)}
.placeholder h3{margin:0 0 8px;color:var(--amber)}
.labsec{margin:0 0 10px}
details.labsec{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#111417}
details.labsec summary{cursor:pointer;color:#8fd6a2;font-weight:600}
section.labsec.live h3{margin:4px 0 8px;font-size:17px}
.labsec .intro{font-size:14px;color:#cfcabe;margin-bottom:10px}
.prog{font:600 12px 'JetBrains Mono',monospace;color:var(--muted);letter-spacing:0}
.bar{height:4px;background:#22282d;border-radius:2px;margin:-2px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}
.item{border-left:2px solid #4a3a1c;padding:4px 0 8px 10px;margin:10px 0}
.item.done{border-left-color:#2f6b40}
.item .q{font-size:14.5px;margin-bottom:6px}
.item .choices{display:grid;gap:6px;margin:6px 0}
.item .ch{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;cursor:pointer;font-size:14px}
.item .ch.on{border-color:var(--amber);background:#2a2216}
.item .ch.ro{cursor:default}.item .ch.right{border-color:#2f6b40;background:#14261a}.item .ch.wrong{border-color:#7a3229;background:#2a1614}
.item textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px;color:var(--text);font:inherit;font-size:14px;resize:vertical;margin-bottom:6px}
.item .ans{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.item .ans input{width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--text);font:600 15px 'JetBrains Mono',monospace}
.item .ans.two label{display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.item .u{color:var(--muted);font-size:13px}
.item .mine{font-size:13.5px;color:#cfcabe;margin:4px 0}
.fb{margin-top:6px;border-radius:7px;padding:8px 10px;font-size:13.5px;line-height:1.45}
.fb.ok{background:#14261a;border:1px solid #2f6b40}.fb.bad{background:#2a1c14;border:1px solid #7a5229}.fb.model{background:#16202a;border:1px solid #2d4c6b}
.nag{color:#ffb38a;font-size:13px;margin-top:6px}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.steps{margin:6px 0;padding-left:20px;font-size:13.5px;color:#cfcabe}
#labRuler{width:100%;height:104px;border-radius:6px;display:block;margin:4px 0 8px}
.rec{display:flex;gap:8px;align-items:center}.rec input{width:90px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--text);font:700 15px 'JetBrains Mono',monospace}
.warnc{color:#ffb38a}
table.dt{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
table.dt th{color:var(--muted);font-weight:600;text-align:left;padding:3px;border-bottom:1px solid var(--line)}
table.dt td{padding:2px 3px;border-bottom:1px solid #20262b}
table.dt input.cell{width:58px;background:#0f1215;border:1px solid #2a3138;border-radius:4px;padding:4px;color:var(--text);font:600 13px 'JetBrains Mono',monospace}
table.dt input.cell.flag{border-color:#c77d3a;background:#2a1c14}
table.dt .x{background:none;border:0;color:#ff7a6b;cursor:pointer;font-size:16px}
table.cand{width:100%;border-collapse:collapse;font-size:13px}table.cand td,table.cand th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}
.labfoot{font-size:12.5px;color:var(--muted);margin-top:8px}.linkbtn{background:none;border:0;color:#f6c983;cursor:pointer;padding:0;font-size:12.5px;text-decoration:underline}
footer{padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="kicker">Strothoff Physics Laboratories</div>
    <h1>Millikan's Basement</h1>
  </div>
  <nav class="modes" id="modes">
    <button data-mode="beam" class="on">Beam line</button>
    <button data-mode="selector">Velocity selector</button>
    <button data-mode="spectro">Mass spectrometer</button>
    <button data-mode="lab">Mystery particle</button>
    <button data-mode="millikan">Millikan</button>
  </nav>
  <div class="predict-switch" id="predictWrap"><span>Predict</span><div class="switch" id="predictSwitch" role="switch" aria-checked="false" tabindex="0"></div></div>
</header>

<main>
  <div class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="cv"></canvas>
      <div class="overlay-tl" id="timeLabel"></div>
      <div class="view-btns">
        <button id="zoomIn" title="Zoom in">+</button>
        <button id="zoomOut" title="Zoom out">−</button>
        <button id="zoomFit" title="Fit view">⤢</button>
      </div>
      <input id="modInput" inputmode="decimal" autocomplete="off">
      <div class="placeholder" id="placeholder" style="display:none"><div class="box"><h3 id="phTitle"></h3><div id="phText"></div></div></div>
    </div>
    <div class="firebar">
      <button class="btn fire" id="fireBtn" hidden>FIRE</button>
      <button class="btn" id="clearBtn" hidden>Clear</button>
      <div class="setup" id="setupBar"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>
  <aside id="side">
    <section class="card" id="labCard" style="display:none"></section>
    <section class="card" id="predictCard" style="display:none"></section>
    <section class="card" id="readoutCard"><h2>Data</h2><div id="readouts"></div></section>
    <section class="card" id="optsCard"></section>
  </aside>
</main>
<footer>
  <span>Millikan's Basement · Strothoff Physics Laboratories</span>
  <span>Created by Christopher B. Slough, Head of Science, Strothoff International School</span>
</footer>

<script>
"use strict";
/* ================= constants (IB data booklet values) ================= */
const C = { e:1.60e-19, me:9.110e-31, mp:1.673e-27, u:1.661e-27, c:3.00e8 };
const PARTICLES = {
  electron:{ name:'Electron',  sym:'e⁻',  m:C.me,          q:-C.e },
  positron:{ name:'Positron',  sym:'e⁺',  m:C.me,          q:C.e },
  proton:  { name:'Proton',    sym:'p⁺',  m:C.mp,          q:C.e },
  deuteron:{ name:'Deuteron',  sym:'d⁺',  m:2.014*C.u,     q:C.e },
  alpha:   { name:'Alpha',     sym:'α²⁺', m:4.0015*C.u,    q:2*C.e },
  custom:  { name:'Custom ion',sym:'ion', m:null, q:null }
};
const COLORS = { dist:'#2dd4bf', dim:'#c58cff', len:'#ffd23f', yind:'#ffffff', vcomp:'#8ff0ff', beam:'#7dffb3', shot2:'#ff7ad9', ghost:'#ffb347', plus:'#ff6161', minus:'#4fa6ff', amber:'#f2a541' };

/* ================= formatting ================= */
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup = n => String(n).split('').map(ch=>SUP[ch]||ch).join('');
function fmt(x, sf=3){
  if (x===null || x===undefined || !isFinite(x)) return '—';
  if (x===0) return '0';
  const neg = x<0; let a = Math.abs(x);
  let ex = Math.floor(Math.log10(a));
  let man = a/Math.pow(10,ex);
  let ms = man.toFixed(sf-1);
  if (parseFloat(ms)>=10){ ex+=1; man=a/Math.pow(10,ex); ms=man.toFixed(sf-1); }
  let s;
  if (ex>=-2 && ex<=3){ s = Number(a.toPrecision(sf)).toString();
    // keep trailing zeros for sig figs
    const digits = s.replace('.','').replace(/^0+/,'').length;
    if (digits<sf){ const dec = Math.max(0, sf-1-ex); s = a.toFixed(dec); }
  } else s = `${ms} × 10${sup(ex)}`;
  return (neg?'−':'') + s;
}
const fu = (x,u,sf=3)=> `${fmt(x,sf)} ${u}`;
function parseNum(str){
  if (typeof str!=='string') return NaN;
  let s = str.trim().replace(/−/g,'-').replace(/,/g,'.').replace(/\s+/g,'');
  s = s.replace(/[×x\*]10\^?\(?(-?\d+)\)?/i, 'e$1');
  if (s==='') return NaN;
  return Number(s);
}
function sigFigs(str){
  let s = str.trim().replace(/−/g,'-').replace(/^[-+]/,'').split(/[eE×x*]/)[0].replace(',', '.');
  s = s.replace('.', ''); s = s.replace(/^0+/,'');
  return s.length;
}
const rndStep = (a,b,step)=> +(a + step*Math.floor(Math.random()*(Math.round((b-a)/step)+1))).toFixed(10);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const p3 = x => Number(x.toPrecision(3));

/* ================= state ================= */
function defaultState(){
  return { particle:'positron', customU:20, customQ:1, Vacc:1000, gap:0.02,
    platesOn:true, Vp:200, pol:1, d:0.02, L:0.05,
    screenOn:true, D:0.15,
    BOn:false, B:0.001, Bdir:-1, W:0.20 };
}
let S = defaultState();
const opts = { dots:true, comps:true, force:true, rhr:true };
let mode = 'beam';

function particleOf(st){
  const p = PARTICLES[st.particle];
  if (st.particle==='mystery'){ const M=MYSTERY[st.mkey]; return { name:'Mystery particle', sym:'?', m:M.m, q:M.q }; }
  if (st.particle==='custom') return { name:'Custom ion', sym:`${st.customU} u, +${st.customQ}e`, m:st.customU*C.u, q:st.customQ*C.e };
  return p;
}
const Vcap = p => p.m*Math.pow(0.1*C.c,2)/(2*Math.abs(p.q));

/* ================= physics: layout + analytic trajectory ================= */
const HH = 0.25; // half-height of B region / view limit (m)
function layout(st, s){
  s = s || view.s || 2000;
  const L = {};
  L.xg0 = 0.03; L.xg1 = L.xg0 + st.gap; let cur = L.xg1;
  if (st.platesOn){ L.xp0 = cur + 0.03; L.xp1 = L.xp0 + st.L; cur = L.xp1; }
  if (st.BOn){
    let gapB = 0.04;
    if (!st.platesOn) gapB = Math.max(gapB, (MOD.w/2+26)/s - (L.xg1-L.xg0)/2);   // clear the accelerating supply
    L.xb0 = cur + gapB; L.xb1 = L.xb0 + st.W; L.xEnd = L.xb1 + 0.06; }
  else if (st.screenOn){ L.xs = cur + st.D; L.xEnd = L.xs + 0.02; }
  else L.xEnd = cur + (st.platesOn? 0.05 : 0.15);
  // wire height: leaves room for the L / D arrows and labels between plates and wires
  // wire height: room for the d module above and the L arrow + L module below the plates
  L.hw = st.platesOn ? Math.max(st.d/2 + Math.max(0.02, (MOD.h+42)/s), (!st.BOn && st.screenOn)? 0.062 : 0) : 0;
  if (st.platesOn) L.xw = L.xp0 + 0.85*st.L;
  return L;
}
function firstRoot(A,B,Cc,tmax){
  const r=[];
  if (Math.abs(A)<1e-300){ if (Math.abs(B)>1e-300) r.push(-Cc/B); }
  else { const disc=B*B-4*A*Cc; if (disc>=0){ const sq=Math.sqrt(disc); r.push((-B-sq)/(2*A),(-B+sq)/(2*A)); } }
  const ok = r.filter(s=>s>1e-18 && s<=tmax);
  return ok.length? Math.min(...ok): null;
}
function computeShot(st){
  const p = particleOf(st), L = layout(st), segs=[], res={ p, L };
  let t=0, s0;
  const push = (dur, f, acc, kind)=>{ segs.push({t0:t, t1:t+dur, f, acc, kind}); t+=dur; };
  // Stage 1: accelerate from rest
  // the gun polarity is set so the particle always speeds up along +x (grids swap for a negative charge)

function resize(){
  const r = cv.getBoundingClientRect(); if (r.width<10 || r.height<10) return;

}

function worldBox(st, s){
  const L=layout(st, s);
  const xMin=L.xg0-0.004, xMax = st.BOn? L.xEnd : (st.screenOn? L.xs+0.004 : L.xEnd);
  let yT=GH+0.008, yB=-(GH+0.008);
  if (st.platesOn){ yT=Math.max(yT,L.hw); yB=Math.min(yB,-L.hw); }
  if (!st.BOn && st.screenOn){ yT=Math.max(yT,0.058); yB=Math.min(yB,-0.058); }
  if (st.BOn){
    if (predict.on || !(st.B>0)){ yT=Math.max(yT,HH); yB=Math.min(yB,-HH); }
    else { const r=computeShot(st); for (const P of r.poly){ if (P.x<L.xb0-1e-6) continue; yT=Math.max(yT,Math.min(HH,P.y+0.015)); yB=Math.min(yB,Math.max(-HH,P.y-0.015)); }

}
/* fit: apparatus + its ring of modules, centred in the canvas */
function computeFit(){
  let s = view.tgt? view.tgt.s : view.s, box;
  const leftPx = Math.max(MOD.w/2, LAUNCH.w+LAUNCH.gap)+10, rightPx = S.platesOn? MOD.w+44 : 14;
  const topPx = (S.BOn || (S.platesOn && !S.BOn && S.screenOn && S.pol>0))? MOD.h+ROW_GAP : 0, botPx = MOD.h+ROW_GAP;
  for (let i=0;i<4;i++){
    box=worldBox(S,s);
    const aw = CW-24-leftPx-rightPx, ah = CH-TOP_PAD-BOT_PAD-topPx-botPx;
    s = Math.max(60, Math.min(aw/(box.xMax-box.xMin), ah/(box.yT-box.yB)));
  }
  box=worldBox(S,s);
  const totW = leftPx+(box.xMax-box.xMin)*s+rightPx, totH = topPx+(box.yT-box.yB)*s+botPx;
  return { s, ox:(CW-totW)/2+leftPx-box.xMin*s, oy:TOP_PAD+Math.max(0,(CH-TOP_PAD-BOT_PAD-totH)/2)+topPx+box.yT*s, yT:box.yT, yB:box.yB };
}
function fitScale(){ if (!CW) return; const f=computeFit(); Object.assign(view,{s:f.s,ox:f.ox,oy:f.oy,yT:f.yT,yB:f.yB}); view.tgt=null; }
function refit(){ // glide smoothly to the new fit instead of jumping

}

function W2S(x,y){ return [CW/2+(view.ox+x*view.s-CW/2)*view.z+view.panX, CH/2+(view.oy-y*view.s-CH/2)*view.z+view.panY]; }

/* ================= shots + animation ================= */
let shots=[];           // {res, color, label, start, dur}

  const Tmax = Math.max(...made.map(m=>m.res.T_total));
  const factor = niceStep(3/Tmax); const n = Math.floor(Math.log10(factor)+1e-9); const mant = Math.round(factor/Math.pow(10,n));

/* ================= drawing ================= */
function draw(){
  if (!CW) return;
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='#0c0f11'; ctx.fillRect(0,0,CW,CH);
  if (!(mode==='beam'||mode==='lab')){ document.getElementById('timeLabel').textContent=''; return; }
  const L = layout(S), k=pxPerM(), ms=modules();
  drawGrid(k);
  drawWires(ms, L);
  drawApparatus(L,k);
  if (!predict.on){ const pr = computeShot(S); drawPoly(pr.poly, Infinity, 'rgba(125,255,179,0.22)', 1.5, [6,5]); }
  if (predict.on && predict.ghost) predict.ghost(ctx);
  if (predict.on && predict.target) predict.target(ctx);
  const now=performance.now();
  for (const sh of shots){
    const tReal = sh.old? sh.res.T_total : Math.min(sh.res.T_total, (now-sh.start)/1000/sh.factor);
    const col = sh.old? 'rgba(125,255,179,0.25)': sh.color;

    if (!sh.old && opts.dots) drawDots(sh, tReal);

  for (const m of ms) drawModule(m, predict.on);

const chById = id => CHALLENGES.find(c=>c.id===id);
/* ================= worked solutions (equation → rearrange → substitute → evaluate) ================= */
const N4 = x=>fmt(x,4), N3 = x=>fmt(x,3);
const VX='v<sub>x</sub>', VY='v<sub>y</sub>', AY='a<sub>y</sub>', VA='V<sub>acc</sub>', VPp='V<sub>p</sub>';
function stp(why, ...eqs){ return {why, eqs}; }
function qNote(p){
  if (p.q<0) return stp('Charge of the particle: q = −e. Use its size |q| for energies, forces and radii; the sign only sets the direction', `|q| = 1.60 × 10⁻¹⁹ C`);
  return Math.abs(p.q-C.e)/C.e<1e-9? null : stp(`Charge of the particle: q = ${Math.round(p.q/C.e)}e`, `q = ${Math.round(p.q/C.e)} × 1.60 × 10⁻¹⁹ = ${N4(p.q)} C`); }
const qS = p=> p.q<0? '|q|' : 'q';
function accS(st){
  const p=particleOf(st), Q=Math.abs(p.q), q=qS(p), v=Math.sqrt(2*Q*st.Vacc/p.m), out=[];
  const qn=qNote(p); if (qn) out.push(qn);
  out.push(stp('Work done by the accelerating p.d. becomes kinetic energy', `${q}V<sub>acc</sub> = ½m${VX}²`));
  out.push(stp(`Rearrange for ${VX}`, `${VX} = √(2${q}${VA} / m)`));
  out.push(stp('Substitute', `${VX} = √(2 × ${N4(Q)} × ${N4(st.Vacc)} / ${N4(p.m)})`));
  out.push(stp('Evaluate', `${VX} = √(${N4(2*Q*st.Vacc/p.m)})`, `${VX} = ${N4(v)} m s⁻¹`));
  return {steps:out, v, p};
}
function plateS(st, v, p, upToY=true){
  const Q=Math.abs(p.q), neg=p.q<0, E=st.Vp/st.d, a=-st.pol*p.q*E/p.m, t=st.L/v, y=0.5*a*t*t, out=[];
  const down = a<0, q=qS(p);
  out.push(stp('Field strength between the plates', `E = ${VPp} / d`, `E = ${N4(st.Vp)} / ${N4(st.d)} = ${N4(E)} V m⁻¹`));
  out.push(stp(neg? `Force on a <b>negative</b> charge points towards the + plate: top plate ${st.pol>0?'+':'−'}, so the force is <b>${down?'downwards (negative)':'upwards (positive)'}</b>`
                   : `Force on a positive charge points from + to −: top plate ${st.pol>0?'+':'−'}, so the force is <b>${down?'downwards (negative)':'upwards (positive)'}</b>`,
    `${AY} = ${down?'−':'+'}${q}E / m`, `${AY} = ${down?'−':''}(${N4(Q)} × ${N4(E)}) / ${N4(p.m)} = ${N4(a)} m s⁻²`));
  if (upToY){
    out.push(stp(`Horizontal velocity is constant between the plates`, `t = L / ${VX}`, `t = ${N4(st.L)} / ${N4(v)} = ${N4(t)} s`));
    out.push(stp(`Vertically: u<sub>y</sub> = 0 and ${AY} is constant, so s = ut + ½at²`, `y = ½${AY}t²`, `y = ½ × (${N4(a)}) × (${N4(t)})²`, `y = ${N4(y)} m`));
  }
  return {steps:out, E, a, t, y, vy:a*t};
}
const ans = (txt)=> stp('<b>Answer</b>', txt);
function solutionSteps(ch, c, res){
  const st=c.st;
  switch (ch.id){
    case 'v': { const A=accS(st); return [...A.steps, ans(`${VX} = ${N3(A.v)} m s⁻¹`)]; }
    case 'ke': { const p=particleOf(st), KE=Math.abs(p.q)*st.Vacc, n=Math.round(Math.abs(p.q)/C.e); const out=[]; const qn=qNote(p); if (qn) out.push(qn);
      out.push(stp('Work done on a charge moved through a p.d.', `E<sub>k</sub> = qV<sub>acc</sub>`));
      out.push(stp('Substitute and evaluate', `E<sub>k</sub> = ${N4(Math.abs(p.q))} × ${N4(st.Vacc)} = ${N4(KE)} J`));
      out.push(stp('In electronvolts: a charge of '+n+'e through V volts gains '+n+'V eV', `E<sub>k</sub> = ${n} × ${N4(st.Vacc)} = ${N4(n*st.Vacc)} eV`));
      return [...out, ans(`E<sub>k</sub> = ${N3(KE)} J = ${N3(n*st.Vacc)} eV`)]; }
    case 'vrev': { const p=particleOf(st), v=c.vTarget, V=p.m*v*v/(2*Math.abs(p.q)); const out=[]; const qn=qNote(p); if (qn) out.push(qn);
      out.push(stp('Work done by the p.d. becomes kinetic energy', `qV<sub>acc</sub> = ½mv²`), stp(`Rearrange for ${VA}`, `${VA} = mv² / (2q)`),
        stp('Substitute', `${VA} = ${N4(p.m)} × (${N4(v)})² / (2 × ${N4(p.q)})`), stp('Evaluate', `${VA} = ${N4(p.m*v*v)} / ${N4(2*p.q)} = ${N4(V)} V`));
      return [...out, ans(`${VA} = ${N3(V)} V`)]; }
    case 'y': case 'ey': { const A=accS(st), P=plateS(st,A.v,A.p); return [...A.steps, ...P.steps, ans(`y = ${N3(P.y)} m = ${N3(P.y*1000)} mm`)]; }
    case 'theta': { const A=accS(st), P=plateS(st,A.v,A.p), th=Math.atan2(P.vy,A.v)*180/Math.PI;
      return [...A.steps, ...P.steps.slice(0,3),
        stp(`Vertical velocity at the exit: v = u + at with u<sub>y</sub> = 0`, `${VY} = ${AY}t`, `${VY} = (${N4(P.a)}) × ${N4(P.t)} = ${N4(P.vy)} m s⁻¹`),
        stp('Angle of the velocity to the horizontal', `tan θ = ${VY} / ${VX}`, `θ = tan⁻¹(${N4(P.vy)} / ${N4(A.v)})`, `θ = tan⁻¹(${N4(P.vy/A.v)}) = ${N4(th)}°`),
        ans(`θ = ${N3(th)}° (${th<0?'below':'above'} the horizontal)`)]; }

        out.push(stp('Time to cross the plates (constant horizontal velocity)', `t = L / ${VX} = ${N4(st.L)} / ${N4(A.v)} = ${N4(tP)} s`));

      out.push(stp('Horizontal distance travelled in that time', `x = ${VX}t = ${N4(A.v)} × ${N4(tH)} = ${N4(x)} m`));

    case 'Yscreen': { const A=accS(st), P=plateS(st,A.v,A.p), t2=st.D/A.v, y2=P.vy*t2, Y=P.y+y2;
      return [...A.steps, ...P.steps,
        stp(`Vertical velocity at the exit`, `${VY} = ${AY}t = (${N4(P.a)}) × ${N4(P.t)} = ${N4(P.vy)} m s⁻¹`),
        stp('After the plates there is no force, so the velocity is constant (a = 0)', `t₂ = D / ${VX} = ${N4(st.D)} / ${N4(A.v)} = ${N4(t2)} s`),
        stp('Extra vertical displacement on the way to the screen', `y₂ = ${VY}t₂ = (${N4(P.vy)}) × ${N4(t2)} = ${N4(y2)} m`),
        stp('Total displacement on the screen', `Y = y + y₂ = (${N4(P.y)}) + (${N4(y2)}) = ${N4(Y)} m`),
        ans(`Y = ${N3(Y*1000)} mm`)]; }
    case 'target': { const Ym=Math.abs(c.Ytarget), V=2*st.d*st.Vacc*Ym/(st.L*(st.L/2+st.D));
      return [
        stp('Deflection between the plates (q and m cancel once v<sub>x</sub>² = 2qV<sub>acc</sub>/m is substituted)', `y = ${VPp}L² / (4d${VA})`),
        stp('Direction of the exit velocity', `tan θ = ${VY}/${VX} = ${VPp}L / (2d${VA})`),
        stp('Straight line to the screen: Y = y + D tan θ', `|Y| = (${VPp}L / 2d${VA}) × (L/2 + D)`),
        stp(`Rearrange for ${VPp}`, `${VPp} = 2d${VA}|Y| / (L(L/2 + D))`),

        stp('Evaluate', `${VPp} = ${N4(2*st.d*st.Vacc*Ym)} / ${N4(st.L*(st.L/2+st.D))} = ${N4(V)} V`),
        stp('Check the direction', `top plate ${st.pol>0?'+ pushes the beam down':'− pulls the beam up'}, which matches the target being ${c.Ytarget<0?'below':'above'} the centre line`),
        ans(`${VPp} = ${N3(V)} V`)]; }

    case 'sense': case 'esense': { const p=particleOf(st), neg=p.q<0, upPos=st.Bdir<0, up=neg? !upPos : upPos; const out=[

      if (neg) out.push(stp('The charge is negative, so F = qv × B points the <b>opposite</b> way to v × B', `F points <b>${up?'up':'down'}</b>`));

      stp('Deflection between the plates for any charge', `y = ½${AY}t²  with  ${AY} = qE/m  and  t = L/${VX}`),

    case 'r': { const A=accS(st), B=st.B, Q=Math.abs(A.p.q), r=A.p.m*A.v/(Q*B);
      return [...A.steps, stp('Magnetic force provides the centripetal force', `qvB = mv² / r`), stp('Rearrange for r', `r = mv / (${qS(A.p)}B)`),

  const ch=chById(predict.chId), c=predict.setup;

function evaluate(made){
  const ch=chById(predict.chId), c=predict.setup, res=made[0].res;
  let ok, html, yours, actual;
  if (ch.kind==='num'){
    const truth = ch.truth(c,res), pred=predict.answerSI, u=ch.units[predict.unitIdx];
    const diff = (pred-truth)/Math.abs(truth)*100;
    ok = Math.abs(diff)<=predict.tol;
    const magOk = Math.abs(Math.abs(pred)-Math.abs(truth))/Math.abs(truth)*100 <= predict.tol;
    yours = `${fmt(pred/u[1],3)} ${u[0]}`; actual = `${fmt(truth/u[1],3)} ${u[0]}`;
    html = `<div class="big">${ok?'Within tolerance':'Outside tolerance'}</div>
      <div class="ro">${rows([['Your prediction',yours],['Actual',actual],['Difference',`${fmt(diff,2)} %`]])}</div>`;
    if (!ok && magOk && Math.sign(pred)!==Math.sign(truth)) html += `<div style="margin-top:6px">Right size, wrong sign. Up and right are positive; down and left are negative.</div>`;
    if (predict.sf<2 || predict.sf>4) html += `<div class="small" style="margin-top:6px">Sig figs: you gave ${predict.sf}. Data like this usually supports 2–3.</div>`;
    if (ch.ghostAfter){ predict.ghost = ch.ghostAfter(c, pred, res); }
  } else {
    const corr = ch.correct(c,res); ok = predict.choice===corr;
    yours = ch.choices[predict.choice]; actual = ch.choices[corr];
    html = `<div class="big">${ok?'Correct':'Not this time'}</div><div>Answer: ${actual}</div>`;
    if (ch.explain) html += `<div class="small" style="margin-top:6px">${ch.explain}</div>`;
  }
  if (ch.extra) html += `<div style="margin-top:6px">${ch.extra(c,res)}</div>`;
  const solH = solutionHTML(ch,c,res);
  // multiple-choice answers can be guessed from the picture, so the proof is always shown
  if (solH) html += (ok && ch.kind==='num') ? `<details class="solbox"><summary>Show the worked solution</summary>${solH}</details>`
                       : `<div class="solbox open"><div class="solhead">${ok?'Why this is right':'Worked solution'}</div>${solH}</div>`;
  html += `<button class="btn primary" id="nextBtn" style="margin-top:10px">Next setup</button>`;
  predict.result = `<div class="feedback ${ok?'ok':'bad'}">${html}</div>`;
  predict.log.push({title:ch.title, yours, actual, ok});
  predict.revealed=true;
  renderPredict(); renderReadouts(res); draw();
  document.getElementById('nextBtn').onclick=newSetup;
}

/* ---------- collect-data UI ---------- */
function collectUI(){
  const rows=LAB.data.map((r,i)=>`<tr><td class="mono">${r.B}</td>${[0,1,2].map(j=>`<td><input class="cell ${r.f&&r.f[j]?'flag':''}" data-r="${i}" data-t="${j}" value="${r.s[j]||''}" inputmode="decimal"></td>`).join('')}<td><button class="x" data-del="${i}" title="Delete row">×</button></td></tr>`).join('');
  return `<canvas id="labRuler" height="104"></canvas>
    <div class="rec"><label>s = <input id="labRead" inputmode="decimal" placeholder="e.g. 8.35"> cm</label><button class="btn primary sm" data-act="record">Record</button></div>
    <div id="recMsg" class="small"></div>
    <table class="dt"><tr><th>B / mT ± ${LAB.res}</th><th colspan="3">s / cm ± 0.05<br><span class="small">trial 1 · 2 · 3</span></th><th></th></tr>${rows || '<tr><td colspan="5" class="small">No data yet.</td></tr>'}</table>`;
}
function wireCollect(){
  drawRuler();
  const rd=document.getElementById('labRead'); if (rd) rd.addEventListener('keydown',e=>{ if (e.key==='Enter'){ e.preventDefault(); labAction('record'); } });
  document.querySelectorAll('#labCard input.cell').forEach(inp=>inp.onchange=()=>{ const r=LAB.data[+inp.dataset.r]; r.s[+inp.dataset.t]=inp.value.trim(); saveLab(); renderLab(); });
  document.querySelectorAll('#labCard button[data-del]').forEach(b=>b.onclick=()=>{ LAB.data.splice(+b.dataset.del,1); saveLab(); renderLab(); });
}
function drawRuler(){
  const c=document.getElementById('labRuler'); if (!c) return;
  const W=c.clientWidth||320, H=104, d=window.devicePixelRatio||1; c.width=W*d; c.height=H*d; const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0);
  g.fillStyle='#e9e2cf'; g.fillRect(0,0,W,H);
  const L=LAB.last;
  if (!L || L.s===null){ g.fillStyle='#3a3226'; g.font="600 13px 'Space Grotesk', sans-serif"; g.textAlign='center';
    g.fillText(L? 'The particle missed the detector: change B.' : 'Fire to see where the particle lands.', W/2, H/2+4); g.textAlign='left'; return; }
  const start=Math.max(0,Math.floor(L.s)-1), span=3, ppc=(W-24)/span, X=v=>12+(v-start)*ppc, base=58;
  // spot (drawn under the ticks, like a phosphor strip behind a scale)
  const sx=X(L.s), gr=g.createRadialGradient(sx,base-30,0,sx,base-30,ppc*0.09+4);
  gr.addColorStop(0,'rgba(30,200,120,0.95)'); gr.addColorStop(0.55,'rgba(30,200,120,0.55)'); gr.addColorStop(1,'rgba(30,200,120,0)');
  g.fillStyle=gr; g.beginPath(); g.ellipse(sx,base-30,ppc*0.09+4,22,0,0,7); g.fill();
  g.strokeStyle='#2a2318'; g.fillStyle='#2a2318'; g.lineWidth=1; g.font="700 13px 'JetBrains Mono', monospace"; g.textAlign='center';
  for (let i=start*10;i<=(start+span)*10;i++){ const x=X(i/10), len=i%10===0?26:i%5===0?18:11; g.beginPath(); g.moveTo(x,base); g.lineTo(x,base-len); g.stroke(); if (i%10===0) g.fillText(String(i/10), x, base+16); }
  g.beginPath(); g.moveTo(8,base); g.lineTo(W-8,base); g.stroke();
  g.font="600 11px 'Space Grotesk', sans-serif"; g.fillText('distance from entry hole / cm', W/2, base+34); g.textAlign='left';
  g.fillStyle='#5a4e3a'; g.fillText(`fired at B = ${L.Btxt} mT`, 8, 14);
}
function labAction(act){
  if (act==='lockV'){ LAB.Vlocked=true; LAB.V=S.Vacc; }
  if (act==='record'){
    const m=document.getElementById('recMsg'), v=parseNum(document.getElementById('labRead').value), raw=document.getElementById('labRead').value.trim();
    if (!LAB.last || LAB.last.s===null){ m.textContent='Fire a particle onto the detector first.'; return; }
    if (LAB.last.Btxt!==bDisp()){ m.textContent='B has changed since that shot. Fire again at this B.'; return; }
    if (!isFinite(v)){ m.textContent='Type your reading of s in cm first.'; return; }
    if (LAB.last.used){ m.textContent='That shot is already recorded. Fire again for the next trial.'; return; }
    let row=LAB.data.find(r=>r.B===LAB.last.Btxt); if (!row){ row={B:LAB.last.Btxt, s:['','',''], f:[0,0,0]}; LAB.data.push(row); LAB.data.sort((a,b)=>parseFloat(a.B)-parseFloat(b.B)); }
    const j=row.s.findIndex(x=>!x); if (j<0){ m.textContent='Three trials are already recorded for this B. Choose another value.'; return; }
    row.s[j]=raw.replace(',','.'); row.f=row.f||[0,0,0]; row.f[j]= Math.abs(v-LAB.last.s)>0.08? 1:0; LAB.last.used=true;
    const dp=(raw.split(/[.,]/)[1]||'').length;
    saveLab(); renderLab();
    const m2=document.getElementById('recMsg');
    if (m2) m2.innerHTML = (row.f[j]? '<span class="warnc">That reading is more than 1 mm from the centre of the spot. Check it (you can edit the cell).</span> ' : '') + (dp!==2? 'Tip: write s to 2 decimal places (e.g. 8.35) to match ±0.05 cm.' : '');
    return;
  }
  if (act==='openGL' || act==='copyGL'){
    LAB.exported=true; saveLab();
    if (act==='copyGL'){ const tsv=['B / mT\ts1 / cm\ts2 / cm\ts3 / cm', ...fullRows().map(r=>[r.B,...r.s].join('\t'))].join('\n');
      navigator.clipboard && navigator.clipboard.writeText(tsv); }
    else { const w=window.open('about:blank','_blank'); graphLabURL().then(u=>{ if (w) w.location.href=u; else location.href=u; }); }
  }
  if (act==='restart'){ if (!confirm('Start a new investigation with a new mystery particle? Your answers and data will be cleared.')) return;
    LAB=newLab(); LAB.st=labDefaultSt(LAB); S={...LAB.st}; shots=[]; fitScale(); }
  if (act==='report'){ downloadReport(); return; }
  saveLab(); renderAll();
}
async function graphLabURL(){
  const rows=fullRows().map(r=>({x:r.B, y:r.s.slice(0,3)}));
  const st={ v:1, title:'Landing distance against magnetic field strength for the mystery particle', showTitle:true,
    x:{name:'Magnetic field strength', sym:'B', unit:'mT', unc:String(LAB.res), mode:'abs'},
    y:{name:'Landing distance', sym:'s', unit:'cm', unc:'0.05', mode:'abs'},
    trials:3, spread:'range', rows, perPoint:false, strict:true, linX:'inv', linY:'none', fit:'linear', maxmin:true, residuals:false, origin:true, tab:'raw' };
  const bytes=new TextEncoder().encode(JSON.stringify(st));
  const b64u=u8=>{ let s=''; u8.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
  if (window.CompressionStream){ const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return GRAPHLAB+'#g=z'+b64u(new Uint8Array(await new Response(cs).arrayBuffer())); }
  return GRAPHLAB+'#g=j'+b64u(bytes);
}
function downloadReport(){
  const strip=h=>String(h).replace(/<br>/g,'\n').replace(/<[^>]+>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<');
  const out=['Millikan\'s Basement — Mystery particle investigation',''];
  SECTIONS.forEach((sec,si)=>{ out.push(`${si+1}. ${sec.title}`); sec.items.forEach(it=>{ const a=LAB.ans[it.id]; if (!a || it.type==='task') return;
    const q=strip(typeof it.q==='function'? it.q(): it.q); let v=a.v; if (it.type==='choice') v=it.opts[a.v]; if (it.type==='num2') v=`${a.v} ; ${a.v2}`;
    out.push('  Q: '+q, '  A: '+v+(a.ok===true?'  (correct)':a.ok===false?'  (check)':''), ''); }); });
  out.push('Data (B / mT, s / cm × 3):', ...LAB.data.map(r=>`  ${r.B}\t${r.s.join('\t')}`));
  const blob=new Blob([out.join('\n')],{type:'text/plain'}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mystery-particle-answers.txt'; a.click();
}

/* ---------- render ---------- */
function itemDone(it){ return it.type==='task'? it.done() : !!LAB.ans[it.id]; }
function qText(it){ return typeof it.q==='function'? it.q() : it.q; }
function itemHTML(it, live){
  const a=LAB.ans[it.id]; let h=`<div class="item ${itemDone(it)?'done':''}" data-item="${it.id}">`;
  if (it.type==='task'){
    if (qText(it)) h+=`<div class="q">${qText(it)}</div>`;
    if (it.ui && live) h+=it.ui();
    if (it.done()) h+=`<div class="fb ok">✓ ${it.doneText? it.doneText():'Done.'}</div>`;
    return h+'</div>';
  }
  h+=`<div class="q">${qText(it)}</div>`;
  if (it.type==='choice'){
    if (!a) h+=`<div class="choices">${it.opts.map((o,i)=>`<button class="ch" data-pick="${i}">${o}</button>`).join('')}</div><button class="btn primary sm" data-submit="${it.id}">Submit answer</button>`;
    else { const c=it.correct(); h+=`<div class="choices">${it.opts.map((o,i)=>`<div class="ch ro ${i===c?'right':''} ${i===a.v&&!a.ok?'wrong':''}">${o}${i===a.v?' <span class="small">(your answer)</span>':''}</div>`).join('')}</div>
      <div class="fb ${a.ok?'ok':'bad'}"><b>${a.ok?'Correct.':'Not quite.'}</b> ${it.why()}</div>`; }
  }
  if (it.type==='num'){
    if (!a) h+=`<div class="ans"><input data-in="${it.id}" inputmode="decimal" placeholder="your answer"><span class="u">${it.unit}</span><button class="btn primary sm" data-submit="${it.id}">Submit</button></div>`;
    else h+=`<div class="mine">Your answer: <b>${a.v} ${it.unit}</b></div><div class="fb ${a.ok?'ok':'bad'}"><b>${a.ok?'Good.':'Compare with this:'}</b> ${it.why(parseFloat(a.v))}</div>`;
  }
  if (it.type==='num2'){
    if (!a) h+=`<div class="ans two"><label>${it.labels[0]} <input data-in="${it.id}" inputmode="decimal"></label><label>${it.labels[1]} <input data-in2="${it.id}" inputmode="decimal"></label><span class="u">${it.unit}</span></div><button class="btn primary sm" data-submit="${it.id}">Submit</button>`;
    else h+=`<div class="mine">Your answer: <b>${it.labels[0]} = ${a.v}, ${it.labels[1]} = ${a.v2} ${it.unit}</b></div><div class="fb ${a.ok?'ok':'bad'}"><b>${a.ok?'Good.':'Compare with this:'}</b> ${it.why(parseFloat(a.v),parseFloat(a.v2))}</div>`;
  }
  if (it.type==='text'){
    if (!a) h+=`<textarea data-in="${it.id}" rows="3" placeholder="Write your answer…"></textarea><button class="btn primary sm" data-submit="${it.id}">Submit</button>`;
    else h+=`<div class="mine">Your answer: <i>${a.v.replace(/</g,'&lt;')}</i></div><div class="fb model"><b>Compare with this model answer:</b><br>${it.model()}</div>`;
  }
  return h+'</div>';
}
function renderLab(){
  const card=document.getElementById('labCard');
  if (mode!=='lab'){ card.style.display='none'; return; }
  card.style.display=''; ensureLab();
  let h=`<h2>Mystery particle <span class="prog">${Math.min(LAB.sec+1,SECTIONS.length)} / ${SECTIONS.length}</span></h2><div class="bar"><i style="width:${(LAB.sec/SECTIONS.length*100).toFixed(0)}%"></i></div>`;
  SECTIONS.forEach((sec,si)=>{
    if (si>LAB.sec) return;
    const live = si===LAB.sec;
    let body=`<div class="intro">${sec.intro()}</div>`, allDone=true;
    for (const it of sec.items){ body+=itemHTML(it, live); if (!itemDone(it)){ allDone=false; break; } }
    if (live && allDone){ body += si<SECTIONS.length-1? `<button class="btn primary" data-act="next">Continue to ${si+2}. ${SECTIONS[si+1].title} →</button>`
      : `<div class="fb ok"><b>Investigation complete.</b> Download your answers to hand in, or start again with a new particle.</div><div class="row2"><button class="btn primary sm" data-act="report">Download my answers</button><button class="btn sm" data-act="restart">New mystery particle</button></div>`; }
    h+= live? `<section class="labsec live"><h3>${si+1}. ${sec.title}</h3>${body}</section>` : `<details class="labsec"><summary>✓ ${si+1}. ${sec.title}</summary>${body}</details>`;
  });
  if (LAB.sec<SECTIONS.length-1) h+=`<div class="labfoot"><button class="linkbtn" data-act="report">Download my answers so far</button> · <button class="linkbtn" data-act="restart">Start again</button></div>`;
  card.innerHTML=h;
  // wiring
  card.querySelectorAll('.choices button.ch').forEach(b=>b.onclick=()=>{ b.parentNode.querySelectorAll('button.ch').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
  card.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>submitItem(b.dataset.submit, b.closest('.item')));
  card.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ if (b.dataset.act==='next'){ LAB.sec++; saveLab(); renderAll(); card.scrollTop=0; return; } labAction(b.dataset.act); });
  const cur=SECTIONS[LAB.sec]; if (cur) cur.items.forEach(it=>{ if (it.wire) it.wire(); });
  card.querySelectorAll('.lres').forEach(e=>e.textContent=LAB.res||'');
  const live=card.querySelector('.labsec.live'); if (live){ const pend=[...live.querySelectorAll('.item')].pop(); if (pend && renderLab._last!==pend.dataset.item){ renderLab._last=pend.dataset.item; pend.scrollIntoView({block:'nearest'}); } }
}
function submitItem(id, el){
  const it=SECTIONS.flatMap(s=>s.items).find(x=>x.id===id); let rec=null;
  const nag=msg=>{ let n=el.querySelector('.nag'); if (!n){ n=document.createElement('div'); n.className='nag'; el.appendChild(n); } n.textContent=msg; };
  if (it.type==='choice'){ const on=el.querySelector('button.ch.on'); if (!on) return nag('Choose an answer first: a guess is fine.'); const v=+on.dataset.pick;
    rec={v, ok: v===it.correct() || (it.alsoOk && it.alsoOk().includes(v))}; }
  if (it.type==='num'){ const raw=el.querySelector(`[data-in="${id}"]`).value.trim(), v=parseNum(raw); if (!isFinite(v)) return nag('Enter a number to continue: your best attempt is fine.'); rec={v:raw, ok:it.check(v).ok}; }
  if (it.type==='num2'){ const r1=el.querySelector(`[data-in="${id}"]`).value.trim(), r2=el.querySelector(`[data-in2="${id}"]`).value.trim(), a=parseNum(r1), b=parseNum(r2);
    if (!isFinite(a)||!isFinite(b)) return nag('Enter both numbers to continue.'); rec={v:r1, v2:r2, ok:it.check(a,b).ok}; if (id==='k') LAB.ans['k_d']={v:r2}; }

  LAB.ans[id]=rec; if (it.after) it.after(); saveLab(); renderAll();
}

/* ================= modes ================= */
const PLACEHOLDERS = {
  selector:['Velocity selector','Crossed E and B fields in one region. Only particles with v = E/B pass through the exit slit; faster ones curve towards the magnetic force, slower ones towards the electric force. Coming in the next build.'],
  spectro:['Mass spectrometer','A mixed beam of ions lands on a detector strip. Switch between “accelerate, then B” (r ∝ √(m/q)) and a Bainbridge layout (r ∝ m/q). Coming in the next build.'],
  millikan:["Millikan's Basement",'Oil drops in real time through a microscope: time the fall with the field off, the rise with the field on, then find r and q with drag and buoyancy. Ionise a drop to watch its charge jump by whole multiples of e. Coming in the next build.']
};
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
  const prev=mode, next=b.dataset.mode; if (prev===next) return;
  if (next==='lab' && predict.on) togglePredict();
  if (prev==='lab'){ saveLab(); if (BEAM_S) S=BEAM_S; }
  if (next==='lab'){ BEAM_S=S; ensureLab(); S={...LAB.st}; }
  shots=[]; renderLegend([]); view.z=1; view.panX=0; view.panY=0;
  mode=next; document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('predictWrap').style.visibility = mode==='beam'? 'visible':'hidden';
  fitScale();
  const ph=document.getElementById('placeholder');
  if (mode==='beam'||mode==='lab'){ ph.style.display='none'; } else { ph.style.display='flex'; document.getElementById('phTitle').textContent=PLACEHOLDERS[mode][0]; document.getElementById('phText').textContent=PLACEHOLDERS[mode][1]; }
  renderAll();
});
const psw=document.getElementById('predictSwitch');
function togglePredict(){
  predict.on=!predict.on; psw.classList.toggle('on',predict.on); psw.setAttribute('aria-checked',predict.on);
  shots=[]; renderLegend([]);
  if (predict.on){ predict.saved={...S}; newSetup(); }
  else { if (predict.saved) S=predict.saved; predict.ghost=null; predict.target=null; view.z=1;view.panX=0;view.panY=0; fitScale(); renderAll(); }
}
psw.onclick=togglePredict; psw.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); togglePredict(); } };
document.getElementById('fireBtn').onclick=doFire;
document.getElementById('clearBtn').onclick=clearShots;

function renderAll(){ renderLab(); renderPredict(); renderControls(); renderOpts(); renderReadouts(); updateFire(); draw(); }
renderAll(); resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ draw(); });
</script>
</body>
</html>
