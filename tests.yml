name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install a headless browser
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Run tests.html
        run: |
          python3 -m http.server 8080 &
          sleep 2
          node tests/ci.mjs
